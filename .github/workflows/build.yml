name: Build and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: '34.0.0'

      - name: Add missing ic_launcher icon files
        run: |
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          # Create minimal 1x1 PNG (valid PNG file)
          python3 -c "
          import struct, zlib
          def make_png():
              w,h = 1,1
              raw = b'\\x00' * (w*h*4)  # RGBA transparent
              def chunk(ctype, data):
                  c = zlib.crc32(ctype+data) & 0xffffffff
                  return struct.pack('>I', len(data)) + ctype + data + struct.pack('>I', c)
              ihdr = struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0)
              idat = zlib.compress(raw)
              png = b'\\x89PNG\\r\\n\\x1a\\n'
              png += chunk(b'IHDR', ihdr)
              png += chunk(b'IDAT', idat)
              png += chunk(b'IEND', b'')
              return png
          with open('icon.png','wb') as f: f.write(make_png())
          "
          for d in hdpi mdpi xhdpi xxhdpi xxxhdpi; do
            cp icon.png app/src/main/res/mipmap-${d}/ic_launcher.png 2>/dev/null || true
            cp icon.png app/src/main/res/mipmap-${d}/ic_launcher_round.png 2>/dev/null || true
          done
          # Create XML for anydpi
          echo '<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"></adaptive-icon>' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          echo '<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"></adaptive-icon>' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: List output files
        run: find app/build -name "*.apk" -ls 2>/dev/null || true

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/mock-location-app-v1.0.${{ github.run_number }}.apk 2>/dev/null || \
          cp app/build/outputs/apk/debug/*.apk release/mock-location-app-v1.0.${{ github.run_number }}.apk 2>/dev/null || \
          find app/build -name "*.apk" -exec cp {} release/mock-location-app-v1.0.${{ github.run_number }}.apk \;

      - name: Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 模拟定位 App v1.0.${{ github.run_number }}
          files: release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
